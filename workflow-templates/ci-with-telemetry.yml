# Starter workflow for ulisseas/* repositories: build on push and pull request.
# Replace the build job with the project's real steps. Telemetry export lives
# in the companion telemetry.yml, which fires when this workflow completes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "replace with the project's build and test steps"
