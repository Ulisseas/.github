# Exports the live state of every run of the listed workflows (Grafana Cloud
# Metrics) and, when each run completes, its OpenTelemetry traces and run
# metrics, through the shared ci-telemetry workflow in ulisseas/.github.
# Add other workflow display names to the list as the project grows.
name: telemetry

on:
  workflow_run:
    workflows: [CI]
    # requested and in_progress push the live state (ci_workflow_status) for
    # the CI status dashboard; completed also exports traces and run metrics.
    types: [requested, in_progress, completed]

permissions: {}

jobs:
  export:
    uses: ulisseas/.github/.github/workflows/ci-telemetry.yml@edbd1fa8cf277210cf51b9032fcc466f6d41dce7 # v1.1.0
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
