# Exports every completed run of the listed workflows as OpenTelemetry traces
# and CI metrics through the shared ci-telemetry workflow in ulisseas/.github.
# Add other workflow display names to the list as the project grows.
name: telemetry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  export:
    uses: ulisseas/.github/.github/workflows/ci-telemetry.yml@677c1ceaf34b315464aa91ce308b91eaa2efbab1 # v1.0.0
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
