# Exports the live state of every lint and Release run of this repo, and the
# traces and metrics of each completed one, through its own
# ci-telemetry workflow, referenced locally so this repo always exports with
# its current code (callers pin a release instead). Inside the org, so
# secrets: inherit works. Release uploads the tag it cut as deployed-version.
name: telemetry

on:
  workflow_run:
    workflows: [lint, Release]
    # requested and in_progress push the live state (ci_workflow_status) for
    # the CI status dashboard; completed also exports traces and run metrics.
    types: [requested, in_progress, completed]

permissions: {}

concurrency:
  group: telemetry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  export:
    uses: ./.github/workflows/ci-telemetry.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    with:
      run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
