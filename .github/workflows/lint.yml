# Lints every workflow file (including the reusable one and the templates) with
# actionlint, which also runs shellcheck on `run:` steps. Its job name "lint" is
# the required status check on main (see scripts/harden-repo.sh).
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          # Release asset pinned by sha256; bump VERSION and SHA256 together
          # (checksums file: actionlint_<v>_checksums.txt on the release).
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -no-color -oneline \
            .github/workflows/*.yml workflow-templates/*.yml
      - name: Record deployed version
        # On main only: a merge here is this repo's deploy, since every caller
        # uses ci-telemetry.yml@main. Read by telemetry.yml as deployed_version.
        if: github.ref == 'refs/heads/main'
        run: printf '%s\n' "${GITHUB_SHA::12}" > deployed-version
      - name: Upload deployed version
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-version
          path: deployed-version
          retention-days: 7
          if-no-files-found: error
