# Reusable workflow: push a workflow run's live state to Grafana Cloud Metrics on
# every workflow_run event, and once the run is completed export it as
# OpenTelemetry spans to Honeycomb and Grafana Cloud Traces and push CI metrics
# to Grafana Cloud Metrics. Provisioned by nshazly/portfolio-infra; the secrets and variables it
# reads are written by that repo's bootstrap at org level (public repos) or at
# repository level (private repos outside the org).
#
# Call it from a small `workflow_run` workflow in each repo, with types
# requested, in_progress and completed. Every event pushes the live state;
# traces and the run metrics are exported from the completed event only
# (cicd.pipeline.result is null while a run is in progress):
#
#   name: telemetry
#   on:
#     workflow_run:
#       workflows: [CI, Release]     # the workflows to export, by display name
#       # requested and in_progress push the live state (ci_workflow_status) for
#       # the CI status dashboard; completed also exports traces and run metrics.
#       types: [requested, in_progress, completed]
#   permissions: {}
#   jobs:
#     export:
#       # pin a release by commit SHA; Dependabot proposes newer ones (README: Versions)
#       uses: ulisseas/.github/.github/workflows/ci-telemetry.yml@<commit sha> # vX.Y.Z
#       with:
#         run_id: ${{ github.event.workflow_run.id }}
#       secrets: inherit
#
# `secrets: inherit` only crosses repositories inside the same organization
# (or enterprise). A caller under a different owner, such as the private
# nshazly/ulisseas-site, must pass the two secrets by name instead:
#
#       secrets:
#         HONEYCOMB_INGEST_KEY: ${{ secrets.HONEYCOMB_INGEST_KEY }}
#         GRAFANA_OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
#
# Variables (vars.*) resolve from the caller either way.
#
# Contract consumed by portfolio-infra (modules/honeycomb, modules/alerting,
# modules/dashboards); change both sides together:
#   spans:   cicd.pipeline.name, cicd.pipeline.result, cicd.pipeline.task.name,
#            vcs.repository.name (added via extraAttributes), root span has no parent
#   metrics: ci_workflow_duration_seconds, ci_workflow_result (gauges) with
#            labels repo, workflow, branch, event, conclusion, version, deployed_version
#            ci_deploy_lead_time_seconds (gauge) with labels repo, workflow,
#            branch, deployed_version; deploys only (see below)
#            ci_workflow_status (gauge, value 1 success, 2 queued, 3 running,
#            4 cancelled, 5 other, 6 failed) and ci_workflow_run_id (gauge,
#            value = run id), labels repo, workflow, branch, event, status,
#            conclusion; every event
#
# Lead time for changes (DORA): ci_deploy_lead_time_seconds = the run's
# completion time (updated_at, the same end as the duration gauge) minus the
# head commit's timestamp (head_commit.timestamp on the run, so no extra API
# call). Emitted only for an actual deploy: conclusion == success and a
# non-empty deployed_version. Skipped when the commit time is missing or the
# difference is negative. For a change made of several commits this is a
# lower bound, since only the newest commit's time is known.
#
# Version labels:
#   version          the tag pointing at the run's head SHA ("v" stripped), or
#                    empty. Only an exact match counts; an untagged commit is
#                    not labelled with an ancestor's release.
#   deployed_version what a deploy run actually shipped, read from an artifact
#                    named `deployed-version` containing one line, if the run
#                    uploaded one. Differs from `version` on a rollback. Empty
#                    when absent. service.version on the spans is
#                    deployed_version, else version, else the SHA.

name: ci-telemetry

on:
  workflow_call:
    inputs:
      run_id:
        description: The workflow run to export (github.event.workflow_run.id from the caller).
        type: string
        required: true
    secrets:
      HONEYCOMB_INGEST_KEY:
        description: Honeycomb ingest key for the github-ci environment.
        required: true
      GRAFANA_OTLP_TOKEN:
        description: Grafana Cloud access-policy token with traces:write and metrics:write.
        required: true

permissions: {}

jobs:
  export:
    name: telemetry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    env:
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Read the run state
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          # The caller's workflow_run action: requested, in_progress or
          # completed. Empty when the caller has another trigger; treated as
          # completed, which keeps the v1.0 behaviour.
          ACTION: ${{ github.event.action }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '{name, event, head_branch, status, conclusion}' > state.json
          status=$(jq -r .status state.json)
          conclusion=$(jq -r '.conclusion // ""' state.json)
          action="${ACTION:-completed}"
          if [ "$action" = "completed" ] && [ "$status" != "completed" ]; then
            echo "::error::run ${RUN_ID} is '${status}', not completed; call this workflow from a workflow_run trigger"
            exit 1
          fi
          # Value of ci_workflow_status, ordered by severity (portfolio-infra
          # modules/dashboards maps it): 1 success, 2 queued, 3 running,
          # 4 cancelled, 5 other, 6 failed. Read from the API, not the event,
          # so a late `requested` export of a finished run reports its final state.
          case "$status" in
            completed)
              case "$conclusion" in
                success) code=1 ;;
                cancelled) code=4 ;;
                failure|timed_out|startup_failure) code=6 ;;
                *) code=5 ;;
              esac ;;
            in_progress) code=3 ;;
            *) code=2 ;;
          esac
          # Traces and the run metrics (result, duration, lead time) are exported
          # from the completed event only, so no run is ever counted twice.
          completed=false
          if [ "$action" = "completed" ]; then completed=true; fi
          {
            echo "name=$(jq -r .name state.json)"
            echo "event=$(jq -r .event state.json)"
            echo "branch=$(jq -r .head_branch state.json)"
            echo "status=$status"; echo "conclusion=$conclusion"; echo "code=$code"
            echo "completed=$completed"
          } >> "$GITHUB_OUTPUT"
          echo "action=$action status=$status conclusion=${conclusion:-<none>} code=$code"

      - name: Build Grafana OTLP auth header
        id: grafana
        env:
          INSTANCE_ID: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
          TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$INSTANCE_ID" "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"

      # Every event: the run's current state as ci_workflow_status (the code
      # above) and its id as ci_workflow_run_id (the dashboard's run link), with
      # labels repo, workflow, branch, event, status, conclusion. conclusion is
      # empty, so absent in Prometheus, until the run completes.
      - name: Push CI status to Grafana Cloud Metrics
        id: status_push
        # A failed live-state push must not skip the traces and run metrics of a
        # completed event; its ::error annotation still shows.
        continue-on-error: true
        env:
          ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
          AUTH: ${{ steps.grafana.outputs.auth }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ steps.event.outputs.name }}
          BRANCH: ${{ steps.event.outputs.branch }}
          EVENT: ${{ steps.event.outputs.event }}
          STATUS: ${{ steps.event.outputs.status }}
          CONCLUSION: ${{ steps.event.outputs.conclusion }}
          CODE: ${{ steps.event.outputs.code }}
        run: |
          now=$(date -u +%s%N)
          body=$(jq -cn --arg repo "$REPO" --arg workflow "$WORKFLOW" --arg branch "$BRANCH" --arg event "$EVENT" \
                        --arg status "$STATUS" --arg conclusion "$CONCLUSION" --arg code "$CODE" \
                        --arg run "$RUN_ID" --arg now "$now" '
            [ {key:"repo",       value:{stringValue:$repo}},
              {key:"workflow",   value:{stringValue:$workflow}},
              {key:"branch",     value:{stringValue:$branch}},
              {key:"event",      value:{stringValue:$event}},
              {key:"status",     value:{stringValue:$status}},
              {key:"conclusion", value:{stringValue:$conclusion}} ] as $attrs
            | { resourceMetrics: [{
                resource: { attributes: [ {key:"service.name", value:{stringValue:"github-ci"}} ] },
                scopeMetrics: [{
                  scope: { name: "ulisseas/.github/ci-telemetry" },
                  metrics: [
                    { name: "ci_workflow_status",
                      gauge: { dataPoints: [ { timeUnixNano: $now, asDouble: ($code|tonumber), attributes: $attrs } ] } },
                    { name: "ci_workflow_run_id",
                      gauge: { dataPoints: [ { timeUnixNano: $now, asDouble: ($run|tonumber), attributes: $attrs } ] } }
                  ] }] }] }')
          # Status code only: run logs on public repos are public.
          http=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Basic $AUTH" -H 'Content-Type: application/json' \
            --data "$body" "$ENDPOINT/otlp/v1/metrics" || echo 000)
          echo "status push: HTTP $http"
          case "$http" in 2??) ;; *) echo "::error::CI status push failed (HTTP $http)"; exit 1 ;; esac

      - name: Resolve run metadata and versions
        id: run
        if: steps.event.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '{name, event, head_branch, head_sha, conclusion, run_started_at, updated_at,
                   commit_ts: .head_commit.timestamp}' > run.json
          name=$(jq -r .name run.json)
          branch=$(jq -r .head_branch run.json)
          event=$(jq -r .event run.json)
          sha=$(jq -r .head_sha run.json)
          conclusion=$(jq -r .conclusion run.json)
          start=$(jq -r .run_started_at run.json)
          end=$(jq -r .updated_at run.json)
          duration=$(( $(date -u -d "$end" +%s) - $(date -u -d "$start" +%s) ))
          commit_ts=$(jq -r '.commit_ts // empty' run.json)

          # version: a tag that points exactly at head_sha. Lightweight tags
          # reference the commit directly; annotated tags reference a tag
          # object whose target is the commit, so resolve both.
          version=""
          while read -r ref tsha ttype; do
            [ -n "$ref" ] || continue
            target="$tsha"
            if [ "$ttype" = "tag" ]; then
              target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tsha}" --jq .object.sha 2>/dev/null || echo "")
            fi
            if [ "$target" = "$sha" ]; then version="${ref#refs/tags/}"; version="${version#v}"; break; fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
                    --jq '.[] | "\(.ref) \(.object.sha) \(.object.type)"' 2>/dev/null)

          # deployed_version: optional one-line artifact uploaded by a deploy run.
          deployed=""
          art_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                    --jq '.artifacts[] | select(.name=="deployed-version" and .expired==false) | .id' | head -1)
          if [ -n "$art_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}/zip" > dv.zip
            deployed=$(unzip -p dv.zip | head -1 | tr -d '[:space:]')
            deployed="${deployed#v}"
          fi

          # service.version for the spans: what shipped, else what was tagged, else the SHA.
          svc_version="${deployed:-${version:-$sha}}"

          # Lead time for changes: deploys only (success + deployed_version),
          # and only when the head commit's time is known and not in the future.
          lead_time=""
          if [ "$conclusion" = "success" ] && [ -n "$deployed" ] && [ -n "$commit_ts" ]; then
            if commit_s=$(date -u -d "$commit_ts" +%s 2>/dev/null); then
              lt=$(( $(date -u -d "$end" +%s) - commit_s ))
              if [ "$lt" -ge 0 ]; then lead_time="$lt"; fi
            fi
          fi

          {
            echo "name=$name"; echo "branch=$branch"; echo "event=$event"; echo "sha=$sha"
            echo "conclusion=$conclusion"; echo "duration=$duration"
            echo "version=$version"; echo "deployed_version=$deployed"
            echo "service_version=$svc_version"; echo "lead_time=$lead_time"
          } >> "$GITHUB_OUTPUT"
          echo "version=${version:-<none>} deployed_version=${deployed:-<none>} service.version=$svc_version lead_time=${lead_time:-<none>}"

      - name: Export trace to Honeycomb
        if: steps.event.outputs.completed == 'true'
        uses: dash0hq/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: grpc://api.honeycomb.io:443/
          otlpHeaders: x-honeycomb-team=${{ secrets.HONEYCOMB_INGEST_KEY }},x-honeycomb-dataset=${{ vars.HONEYCOMB_DATASET }}
          otelServiceName: ${{ vars.HONEYCOMB_DATASET }}
          extraAttributes: vcs.repository.name=${{ github.repository }},service.version=${{ steps.run.outputs.service_version }}
          githubToken: ${{ github.token }}
          runId: ${{ env.RUN_ID }}

      - name: Export trace to Grafana Cloud Traces
        if: steps.event.outputs.completed == 'true'
        uses: dash0hq/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}/otlp/v1/traces
          otlpHeaders: Authorization=Basic ${{ steps.grafana.outputs.auth }}
          otelServiceName: ${{ vars.HONEYCOMB_DATASET }}
          extraAttributes: vcs.repository.name=${{ github.repository }},service.version=${{ steps.run.outputs.service_version }}
          githubToken: ${{ github.token }}
          runId: ${{ env.RUN_ID }}

      # The exporter emits traces only. The Sites/CI/Releases dashboards and the
      # two CI alert rules in portfolio-infra read Prometheus gauges, so push
      # those through the same OTLP gateway (OTLP metrics -> Mimir; dots become
      # underscores, datapoint attributes become labels). Metric names already
      # carry their unit suffix and set no OTLP `unit`, so no suffix is added
      # and each Prometheus name equals the OTLP name.
      - name: Push CI metrics to Grafana Cloud Metrics
        if: steps.event.outputs.completed == 'true'
        env:
          ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
          AUTH: ${{ steps.grafana.outputs.auth }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ steps.run.outputs.name }}
          BRANCH: ${{ steps.run.outputs.branch }}
          EVENT: ${{ steps.run.outputs.event }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          DURATION: ${{ steps.run.outputs.duration }}
          VERSION: ${{ steps.run.outputs.version }}
          DEPLOYED_VERSION: ${{ steps.run.outputs.deployed_version }}
          LEAD_TIME: ${{ steps.run.outputs.lead_time }}
        run: |
          now=$(date -u +%s%N)
          attrs=$(jq -cn --arg repo "$REPO" --arg workflow "$WORKFLOW" --arg branch "$BRANCH" --arg event "$EVENT" \
                        --arg conclusion "$CONCLUSION" --arg version "$VERSION" --arg deployed "$DEPLOYED_VERSION" '
            [ {key:"repo",             value:{stringValue:$repo}},
              {key:"workflow",         value:{stringValue:$workflow}},
              {key:"branch",           value:{stringValue:$branch}},
              {key:"event",            value:{stringValue:$event}},
              {key:"conclusion",       value:{stringValue:$conclusion}},
              {key:"version",          value:{stringValue:$version}},
              {key:"deployed_version", value:{stringValue:$deployed}} ]')
          # Lead time carries no conclusion (always success) or version label.
          lt_attrs=$(jq -c '[ .[] | select(.key == "repo" or .key == "workflow" or .key == "branch" or .key == "deployed_version") ]' <<<"$attrs")
          body=$(jq -cn --argjson attrs "$attrs" --argjson lt_attrs "$lt_attrs" --arg now "$now" \
                        --arg dur "$DURATION" --arg lt "$LEAD_TIME" --arg svc "github-ci" '{
            resourceMetrics: [{
              resource: { attributes: [ {key:"service.name", value:{stringValue:$svc}} ] },
              scopeMetrics: [{
                scope: { name: "ulisseas/.github/ci-telemetry" },
                metrics: ([
                  { name: "ci_workflow_duration_seconds",
                    gauge: { dataPoints: [ { timeUnixNano: $now, asDouble: ($dur|tonumber), attributes: $attrs } ] } },
                  { name: "ci_workflow_result",
                    gauge: { dataPoints: [ { timeUnixNano: $now, asDouble: 1, attributes: $attrs } ] } }
                ] + (if $lt == "" then [] else [
                  { name: "ci_deploy_lead_time_seconds",
                    gauge: { dataPoints: [ { timeUnixNano: $now, asDouble: ($lt|tonumber), attributes: $lt_attrs } ] } }
                ] end)) }] }] }')
          # Run logs on public repos are public: print the status code only.
          # -s hides curl's own error text (which would include the gateway
          # URL); the response body is never printed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Basic $AUTH" -H 'Content-Type: application/json' \
            --data "$body" "$ENDPOINT/otlp/v1/metrics" || echo 000)
          echo "metrics push: HTTP $code"
          case "$code" in 2??) ;; *) echo "::error::CI metrics push failed (HTTP $code)"; exit 1 ;; esac
