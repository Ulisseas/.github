# Dependabot: keeps the release tooling (npm) and the actions used by this
# repo's workflows current. Minor/patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
