# Dependabot: keeps the release tooling (npm) and the actions used by this
# repo's workflows current. Minor/patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]
    ignore:
      # conventional-changelog-conventionalcommits 10.x needs
      # conventional-changelog-writer 9, but @semantic-release/release-notes-
      # generator still bundles writer 8; the Release workflow then fails at
      # the notes step (same rule as ulisseas-site). Drop this once the notes
      # generator moves to writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Vancouver
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
    # Actions run inside ci-telemetry.yml in every caller, so a bump must ship:
    # "fix(deps)" makes semantic-release cut a patch on merge ("chore" cuts
    # nothing). npm updates above stay "chore": they only touch release tooling.
    commit-message:
      prefix: fix
      include: scope
